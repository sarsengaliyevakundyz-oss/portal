server {

  listen 80 default_server;
  listen [::]:80 default_server;

  root /usr/share/nginx/html;
  index index.html index.htm;

  location ~* \.(jpg|jpeg|png|gif|ico|webp|svg)$ {
    expires 1d;
    add_header Cache-Control "public, max-age=86400";
  }


  location ^~ /internalportalfront/ {
    alias /usr/share/nginx/html/;
    index index.html;
    try_files $uri $uri/ /internalportalfront/index.html;
  }
  location /internalportalfiles {
        proxy_pass http://172.16.18.90:9000/internalportalfiles;
        proxy_redirect off;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120;
        proxy_connect_timeout 120;
        proxy_next_upstream error timeout invalid_header http_500 http_503;

    }
  location /internalportal {
    proxy_pass http://172.16.18.182:9999/internalportal;
    proxy_redirect off;
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120;
    proxy_connect_timeout 120;
    proxy_next_upstream error timeout invalid_header http_500 http_503;
  }
  location /realms {
    proxy_pass http://172.16.18.47:8282/realms;
    proxy_redirect off;
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120;
    proxy_connect_timeout 120;
    proxy_next_upstream error timeout invalid_header http_500 http_503;
  }
  error_page  405     =200 $uri;

  error_page   500 502 503 504  /50x.html;
  location = /50x.html {
    root /usr/local/openresty/nginx/html;
  }
}
