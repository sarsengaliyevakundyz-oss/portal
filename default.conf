server {
  listen 80 default_server;
  listen [::]:80 default_server;

  root /usr/share/nginx/html;
  index index.html index.htm;

  location ^~ /internalportalfront/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /internalportalfront/index.html;
    error_page 403 404 = /internalportalfront/index.html;

    location ~* index\.html$ {
      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
      add_header Pragma "no-cache";
      expires 0;
    }
    location ~* \.(js|css)$ {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf)$ {
      expires 1d;
      add_header Cache-Control "public, max-age=86400";
    }
  }

  location = /internalportalfront { return 301 /internalportalfront/; }

  # ✅ SSO фронт
  location /ssointernalfrontnew/ {
    proxy_pass http://172.16.18.182:9999/ssointernalfrontnew/;
    proxy_redirect off;
    proxy_set_header Host $host;                 # ✅ без порта
    proxy_set_header X-Forwarded-Host $host;     # ✅ без порта
    proxy_set_header X-Forwarded-Port 80;        # ✅ порт отдельно
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120;
    proxy_connect_timeout 120;
  }

  location /internalportalfiles {
    proxy_pass http://172.16.18.99:9999/internalportalfiles;
    proxy_redirect off;
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120;
    proxy_connect_timeout 120;
    proxy_next_upstream error timeout invalid_header http_500 http_503;
  }

  location /internalportal {
    proxy_pass http://172.16.18.182:9999/internalportal;
    proxy_redirect off;
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120;
    proxy_connect_timeout 120;
    proxy_next_upstream error timeout invalid_header http_500 http_503;
  }

  location /realms {
    proxy_pass http://172.16.18.47:8282/realms;
    proxy_redirect off;
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120;
    proxy_connect_timeout 120;
    proxy_next_upstream error timeout invalid_header http_500 http_503;
  }

  location /sso-internal-back-new {
    proxy_pass http://172.16.18.182:9999/sso-internal-back-new;
    proxy_redirect off;
    proxy_set_header Host $host;                 # ✅ без порта
    proxy_set_header X-Forwarded-Host $host;     # ✅ без порта
    proxy_set_header X-Forwarded-Port 80;        # ✅ порт отдельно
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120;
    proxy_connect_timeout 120;
    proxy_next_upstream error timeout invalid_header http_500 http_503;
  }

  error_page 405 =200 $uri;
  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/local/openresty/nginx/html;
  }
}
