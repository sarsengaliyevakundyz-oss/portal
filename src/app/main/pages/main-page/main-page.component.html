<div class="stats-block">
  <div class="image-container">
    <img src="e-logo.png" alt="Statistics Logo" />
  </div>
  <div class="text-container">
    <h1 class="title">СТАТИСТИКА</h1>
    <p class="description">
      {{'main.text' | translate}}
    </p>
  </div>
</div>

<div class="welcome-message" *ngIf="!isAuthenticated()">
  <h2>Порталға қош келдіңіз</h2>
  <p>Қазақстан Республикасы Стратегиялық жоспарлау және реформалар агенттігі</p>
  <p>Ұлттық статистика бюросы</p>
  <p>«Е-статистика» интеграцияланған ақпараттық жүйе</p>
</div>

<main class="main-content" [class.hidden]="!isAuthenticated()">
  <section class="news">
    <app-news></app-news>
    <div class="news-list-more">
      <a routerLink="/news">{{'action.more' | translate}}...</a>
    </div>
  </section>

  <section class="calendar">
    <app-calendar></app-calendar>
  </section>
</main>
