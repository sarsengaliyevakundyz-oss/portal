<div class="documents-container">

  <h1>{{ 'documents.title' | translate }}</h1>

  <!-- 🔹 КАТЕГОРИИ -->
  <div *ngIf="viewMode === 'menu'" class="items-container">

    <div
      class="item animate-item"
      *ngFor="let cat of categories; let i = index"
      (click)="openCategory(cat)"
      [style.animation-delay]="(i * 0.08) + 's'"
    >
      <div class="item-title">
        {{ cat.name }}
      </div>

      <div class="item-icon">
        <img src="BDAP.png" />
      </div>
    </div>

  </div>

  <!-- 🔹 ДОКУМЕНТЫ -->
  <div *ngIf="viewMode === 'documents'" class="page-layout">

    <!-- 🔹 HEADER -->
    <div class="page-header">

      <button
        nz-button
        nzType="default"
        class="back-btn"
        (click)="goBack()"
      >
        ← {{ 'common.back' | translate }}
      </button>

      <h3 class="page-title">
        {{ selectedCategory?.name }}
      </h3>

    </div>

    <div class="main-content">

      <!-- 🔹 ПОИСК -->
      <div class="search-area">

        <nz-input-group [nzSuffix]="suffixIconSearch" class="search-input">
          <input
            type="text"
            nz-input
            [(ngModel)]="searchValue"
            [placeholder]="'documents.search.placeholder' | translate"
            (keyup.enter)="search()"
          />
        </nz-input-group>

        <ng-template #suffixIconSearch>
          <span nz-icon nzType="search"></span>
        </ng-template>

        <button nz-button nzType="primary" class="search-btn" (click)="search()">
          {{ 'documents.search.button' | translate }}        </button>

        <button nz-button *ngIf="searchValue" (click)="resetSearch()">
          {{ 'common.reset' | translate }}
        </button>

      </div>

      <!-- 🔹 СПИННЕР ЗАГРУЗКИ -->
      <nz-spin [nzSpinning]="loadingDocuments" [nzSize]="'large'">

        <!-- 🔹 ТАБЛИЦА -->
        <nz-table
          [nzData]="documents"
          [nzShowPagination]="true"
          [nzFrontPagination]="false"
          [nzTotal]="totalElements"
          [nzPageIndex]="currentPage + 1"
          [nzPageSize]="pageSize"
          [nzPageSizeOptions]="[10, 20, 50, 100]"
          (nzPageIndexChange)="onPageChange($event)"
          (nzPageSizeChange)="onPageSizeChange($event)"
          [nzNoResult]="emptyTpl">

          <ng-template #emptyTpl>
            <div class="empty-state">
              <span nz-icon nzType="file" nzTheme="outline" style="font-size: 48px; color: #ccc;"></span>
              <p>{{ 'documents.noDocuments' | translate }}</p>
            </div>
          </ng-template>

          <thead>
          <tr>
            <th>№</th>

            <th *ngFor="let col of columns">
              {{ col.title }}
            </th>

            <th></th>
          </tr>
          </thead>

          <tbody>
          <tr *ngFor="let doc of documents; let i = index">
            <td>{{ currentPage * pageSize + i + 1 }}</td>

            <td *ngFor="let col of columns">
              {{ getDynamicValue(doc, col.key) }}
            </td>

            <td>
              <button nz-button nzType="link" (click)="download(doc)">
                <span nz-icon nzType="download"></span>
                {{ 'common.download' | translate }}
              </button>
            </td>
          </tr>
          </tbody>

        </nz-table>

      </nz-spin>
    </div>
  </div>

</div>
