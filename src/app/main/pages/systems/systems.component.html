<div class="items-container">
  <a class="item" *ngFor="let item of items" [routerLink]="['/systems', item.id]">
    <div class="item-title">
      {{ item.name }}
    </div>
    <div class="item-icon">
      <img [src]="'/systems' + item.pathImg + '.png'" alt="{{ item.name }}">
    </div>
  </a>
</div>
