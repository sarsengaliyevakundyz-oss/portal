<h1>{{ 'main.system' | translate }}</h1>
<div class="items-container">
  <a class="item" *ngFor="let item of items" [routerLink]="['/systems', item.id]">
    <div class="item-title">
      {{ item.name | nameTranslate }}
    </div>
    <div class="item-icon">
      <img [src]="item.pathImg | nameTranslate" alt="{{ item.name }}" (error)="onImgError($event)">
    </div>
  </a>
</div>
