<div class="container">
  <!-- Фильтр -->
  <div class="filter">
    <h4>Тема</h4>
    <div *ngFor="let cat of categories">
      <label>
        <input type="radio" name="category" [value]="cat.id" [(ngModel)]="query.categoryId" (ngModelChange)="loadData()">
        {{ cat.name | nameTranslate }}
      </label>
    </div>

    <h4>Период</h4>
    <div *ngFor="let year of years">
      <label>
        <input type="radio" name="year" [value]="year" [(ngModel)]="query.year" (ngModelChange)="loadData()">
        {{ year }}
      </label>
    </div>
  </div>

  <!-- Список новостей -->
  <div class="news-list">
    <div *ngFor="let news_item of news" class="news-item" (click)="window.open('news/'+news_item.id, '_self')">
      <img [src]="news_item.imageDescription" alt="News Image">
      <div class="news-content">
        <h5>{{ news_item.title }}</h5>
        <p>{{ news_item.description }}</p>
        <small>{{ news_item.publishDate | date : 'dd-MM-yyyy' }} | <span class="tag">{{ news_item.vipCategory }}</span></small>
      </div>
    </div>
    <nz-pagination [nzPageSize]="query.limit"
                   [nzTotal]="total"
                   [nzPageIndex]="query.page + 1"></nz-pagination>
  </div>
</div>
