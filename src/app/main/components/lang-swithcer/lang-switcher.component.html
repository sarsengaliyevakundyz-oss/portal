<div class="lang-switch" (document:click)="closeLanguageList($event)">
  <button class="lang-switch-button" (click)="toggleLanguageList($event)" [ngClass]="{'open': isLanguageListVisible}">
    {{ currentLanguage }}
    <img src="lang_switch_arrow.png" alt="Arrow" class="arrow-icon">
  </button>
  <div class="language-list" *ngIf="isLanguageListVisible">
    <ul>
      <li *ngIf="currentLanguage !== 'Қаз'" (click)="changeLanguage('kz')">Қаз</li>
      <li *ngIf="currentLanguage !== 'Рус'" (click)="changeLanguage('ru')">Рус</li>
      <li *ngIf="currentLanguage !== 'Eng'" (click)="changeLanguage('en')">Eng</li>
    </ul>
  </div>
</div>
