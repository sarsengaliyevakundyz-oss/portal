<div class="calendar-container">
  <h1>Календарь</h1>

  <!-- Навигация -->
  <div class="navigation">
    <div class="month-selector">
      <img (click)="prevMonth()" style="margin-right: 7px" src="arrow_left.png">
      <span class="month-label">{{ selectedMonthName }}</span>
      <img (click)="nextMonth()" style="margin-right: 7px" src="arrow_right.png">
    </div>
    <div class="year-selector">
      <span class="year" (click)="selectPreviousYear()">{{ selectedYear-1 }}</span>
      <span class="current-year">{{ selectedYear }}</span>
      <span class="year" (click)="selectNextYear()" *ngIf="currentYear+1!=selectedYear">{{ selectedYear+1 }}</span>
    </div>
    <div class="region-selector">
      <nz-select
        [(ngModel)]="selectedRegion"
        [nzSuffixIcon]="arrowTemplate"
        class="custom-select"
      >
        <nz-option *ngIf="selectedRegion!=1" nzValue="1" nzLabel="Регион"></nz-option>
        <nz-option *ngIf="selectedRegion!=2" nzValue="2" nzLabel="Корреспондент"></nz-option>
        <nz-option  [nzValue]="1" nzLabel="Регион" nzHide></nz-option>

      </nz-select>
      <ng-template #arrowTemplate>
        <img src="arrow_bottom.png" style="width: 13px; height: 7px;" alt="Arrow" />
      </ng-template>
    </div>
  </div>

  <!-- Календарь -->
  <div class="calendar-grid">

  </div>

</div>
