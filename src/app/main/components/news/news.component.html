<div class="news-container">
  <h1>{{'title.news' | translate}}</h1>
  <div class="navigation">
    <div class="categories-carousel">
      <img (click)="prevCategory()" class="carousel-arrow" src="arrow_left.png" alt="Previous">
      <nz-carousel 
        [nzDots]="false"
        [nzEffect]="'fade'"
        class="categories-carousel-content"
        [(nzCurrent)]="currentCategoryIndex"
        (nzCurrentChange)="onCategoryChange()"
      >
        <div nz-carousel-content *ngFor="let category of categories">
          <span class="category-name">{{ category.name | nameTranslate }}</span>
        </div>
      </nz-carousel>
      <img (click)="nextCategory()" class="carousel-arrow" src="arrow_right.png" alt="Next">
    </div>
    <ng-template #arrowTemplate>
      <img src="arrow_bottom.png" style="width: 13px; height: 7px;" alt="Arrow" />
    </ng-template>
  </div>

  <div *ngIf="loading" class="loading-spinner">
    <nz-spin nzSimple></nz-spin>
  </div>

  <div class="carousel-wrapper" *ngIf="!loading && news.length">
    <nz-carousel 
      [nzAutoPlay]="true"
      [nzAutoPlaySpeed]="5000"
      [nzEffect]="'fade'"
      [nzDotPosition]="'bottom'"
      class="single-item-carousel"
    >
      <div nz-carousel-content *ngFor="let item of news">
        <div class="carousel-news-item" [routerLink]="'/news/'+item.id">
          <div class="news-header">
            <div class="news-top">
              <div class="news-image">
                <img [src]="environment.storageUrl + item.imageDescription" alt="news image">
              </div>
              <div class="news-content">
                <h2>{{ item.title }}</h2>
                <div class="news-date">{{ item.publishDate | date: 'dd.MM.yyyy' }}</div>
              </div>
            </div>
            <div class="news-short-text">
              <p>{{ item.description }}</p>
            </div>
          </div>
        </div>
      </div>
    </nz-carousel>

    <div class="carousel-controls">
      <button nz-button nzType="default" class="carousel-arrow prev" (click)="prevSlide()">
        <span nz-icon nzType="left"></span>
      </button>
      <button nz-button nzType="default" class="carousel-arrow next" (click)="nextSlide()">
        <span nz-icon nzType="right"></span>
      </button>
    </div>
  </div>

  <div class="news-list" *ngIf="!loading && news.length > 1">
    <div class="news-list-item" *ngFor="let item of news.slice(1, 3)" [routerLink]="'/news/' + item.id">
      <div class="news-list-header">
        <div class="news-list-date">{{ item.publishDate | date: 'dd.MM.yyyy' }}</div>
        <div class="news-list-title">{{ item.title }}</div>
      </div>
      <p class="news-list-short-text">{{ item.description }}</p>
    </div>
  </div>
</div>
