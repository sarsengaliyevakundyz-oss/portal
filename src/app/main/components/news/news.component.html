<div class="news-container">
  <h1>{{'title.news' | translate}}</h1>
  <div class="navigation">
    <div class="categories-carousel">
      <div class="categories-carousel">
        <div class="carousel-container">
          <img
            (click)="scrollCategories(-1)"
            [class.disabled]="currentCategoryIndex === 0"
            src="arrow_left.png"
            alt="Previous"
            style="margin-right: 20px"
          />

          <div style="margin-right: 20px" class="category-item">
            {{ categories[currentCategoryIndex]?.name | nameTranslate }}
          </div>

          <img
            (click)="scrollCategories(1)"
            [class.disabled]="currentCategoryIndex === categories.length - 1"
            src="arrow_right.png"
            alt="Next"
          />
        </div>
      </div>
    </div>
  </div>

  <div class="news-item" *ngIf="news.length" [routerLink]="'/news/'+news[0].id">
    <div class="news-header">
      <div class="news-image">
        <img [src]="environment.storageUrl + news[0].imageDescription" alt="news image">
      </div>
      <div class="news-content">
        <h2>{{ news[0].title }}</h2>
        <div class="news-date">{{ news[0].publishDate | date: 'dd.MM.yyyy' }}</div>
      </div>
      <div class="news-short-text">
        <p>{{ news[0].description }}</p>
      </div>
    </div>
  </div>

  <div class="news-list" *ngIf="news.length > 1">
    <div class="news-list-item" *ngFor="let item of news.slice(1)" [routerLink]="'/news/' + item.id">
      <div class="news-list-header">
        <div class="news-list-date">{{ item.publishDate | date: 'dd.MM.yyyy' }}</div>
        <div class="news-list-title">{{ item.title }}</div>
      </div>
      <p class="news-list-short-text">{{ item.description }}</p>
    </div>
  </div>
</div>
