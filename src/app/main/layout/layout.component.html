<div class="container">
  <!-- Header Section -->
  <div class="top-header" style="max-width: 1200px; margin: 0 auto;">
    <div class="nav-logo">
      <img src="logo.png" alt="QazStat">
    </div>
    <nav class="nav-menu">
      <a routerLink="/" [class.active]="isExactMatch('/')">Главная</a>
      <a routerLink="/systems" routerLinkActive="active">Системы</a>
      <a routerLink="/documentation" routerLinkActive="active">Документация</a>
      <a routerLink="/profile" routerLinkActive="active">Личный кабинет</a>
    </nav>
    <div class="user-actions">
      <div class="user-actions">
        <app-lang-switcher></app-lang-switcher>
        <a routerLink="/profile" routerLinkActive="active" class="profile-btn"><img style="margin-right: 7px; margin-bottom: 3px" src="profile.png">Профиль</a>
      </div>
    </div>
  </div>

  <div class="content" style="max-width: 1200px; margin: 0 auto;">
    <router-outlet></router-outlet>
  </div>

</div>

<div class="footer">
  <app-footer></app-footer>
</div>
