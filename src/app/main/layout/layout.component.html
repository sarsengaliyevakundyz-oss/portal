<div class="container">
  <div class="top-header">
    <div class="nav-logo">
      <img src="logo.png" alt="QazStat">
      <!-- <label [innerHTML]="'main.title' | translate"></label> -->
    </div>
    <nav class="nav-menu" *ngIf="isAuthenticated()">
      <a routerLink="/" [class.active]="isExactMatch('/')">{{'main.name' | translate}}</a>
      <a routerLink="/systems" routerLinkActive="active">{{'main.system' | translate}}</a>
      <a routerLink="/documentation" routerLinkActive="active">{{'main.document' | translate}}</a>
      <a routerLink="/admin" routerLinkActive="active">{{'main.personal_cabinet' | translate}}</a>
    </nav>
    <div class="user-actions" *ngIf="isAuthenticated()">
      <app-lang-switcher></app-lang-switcher>
      <div class="profile-container">
        <a 
          routerLinkActive="active" 
          class="profile-btn"
          (click)="toggleProfileMenu()"
        >
          <img style="margin-right: 7px; margin-bottom: 3px" src="profile.png">
          {{currentUser.getCurrentUser()?.full_name}}
        </a>
        <div class="profile-menu" *ngIf="showProfileMenu">
          <button class="menu-item" [disabled]="isLoggingOut" (click)="deactivateToken()">
            {{ isLoggingOut ? 'Выход...' : 'Выход' }}
          </button>
        </div>
      </div>
    </div>
  </div>


  <div class="content">
    <router-outlet></router-outlet>
  </div>

  <div class="footer">
    <app-footer></app-footer>
  </div>

</div>
