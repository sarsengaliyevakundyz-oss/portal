<h2>Профиль</h2>
<div class="user-container">
  <h2 class="user-name">{{ user?.name }}</h2>
  <p class="user-login">Логин: {{ user?.login }}</p>

  <div *ngFor="let systemWrapper of user?.systems" class="system">
    <h3 class="system-title">{{ systemWrapper.system.systemInfo.name | nameTranslate }}</h3>

    <div *ngFor="let child of systemWrapper.system.children" class="child">
      <h4 class="child-title">{{ child.name | nameTranslate }}</h4>
      <ul class="roles-list">
        <li *ngFor="let role of child.roles" class="role-item">{{ role }}</li>
      </ul>
    </div>
  </div>
</div>
