<div class="profile-container">
  <div class="profile-header">
    <h2 class="profile-title">{{ 'administrations.profile' | translate }}</h2>
  </div>

  <!-- Карточка пользователя -->
  <div class="user-card" *ngIf="user">
    <div class="user-avatar">
      <div class="avatar-circle">
        <span class="avatar-initials">{{ getInitials(user.fullName) }}</span>
      </div>
    </div>
    <div class="user-info">
      <h3 class="user-fullname">{{ user.fullName }}</h3>
      <p class="user-login">
        <span nz-icon nzType="user" nzTheme="outline"></span>
        {{ 'administrations.login' | translate }}: {{ user.login }}
      </p>
    </div>
  </div>

  <!-- Системы и подсистемы -->
  <div class="systems-container" *ngIf="user?.systems?.length">
    <div class="systems-list">
      <div
        *ngFor="let system of user?.systems; let i = index"
        class="system-card animate-system"
        [class.expanded]="expandedSystems[i]"
        [style.animation-delay]="(i * 0.08) + 's'">

        <div class="system-header" (click)="toggleSystem(i)">
          <div class="system-info">
            <div class="system-details">
              <span class="system-name">{{ system.name }}</span>
            </div>
          </div>
          <div class="system-actions">
            <span class="system-arrow" [class.rotated]="expandedSystems[i]">
              <span nz-icon nzType="down"></span>
            </span>
          </div>
        </div>

        <div class="subsystems-wrapper" [class.expanded]="expandedSystems[i]">
          <div class="subsystems-list">
            <div
              *ngFor="let subsystem of system.subsystems; let j = index"
              class="subsystem-card animate-subsystem"
              [style.animation-delay]="(j * 0.05) + 's'">

              <div class="subsystem-header" (click)="toggleChild(i, j)">
                <div class="subsystem-info">
                  <span class="subsystem-name">{{ subsystem.name }}</span>
                </div>
                <span class="subsystem-arrow" [class.rotated]="expandedChildren[i]?.[j]">
                  <span nz-icon nzType="right"></span>
                </span>
              </div>

              <div class="roles-wrapper" [class.expanded]="expandedChildren[i]?.[j]">
                <div class="roles-content">
                  <div class="roles-list">
                    <nz-tag
                      *ngFor="let role of subsystem.roles; let k = index"
                      [nzColor]="'blue'"
                      [nzBordered]="false"
                      class="animate-role"
                      [style.animation-delay]="(k * 0.03) + 's'">
                      {{ role }}
                    </nz-tag>
                    <div class="no-roles" *ngIf="!subsystem.roles?.length">
                      {{ 'profile.noRoles' | translate }}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Пустое состояние -->
  <div class="empty-state animate-fade" *ngIf="!user?.systems?.length">
    <span nz-icon nzType="folder-open" nzTheme="outline"></span>
    <p>{{ 'profile.noSystems' | translate }}</p>
  </div>
</div>
