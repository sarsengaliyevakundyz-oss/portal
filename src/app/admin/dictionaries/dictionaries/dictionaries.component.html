<div class="custom-select">
  <select (change)="navigateToPage($event)" [disabled]="isLoading">
    <option *ngIf="isLoading" value="">
      {{ 'common.loading' | translate }}…
    </option>

    <option *ngIf="!isLoading && allowedSections.length === 0" value="">
      {{ 'У вас нет доступа к административным разделам' | translate }}
    </option>
    <option
      *ngFor="let section of allowedSections"
      [value]="section.route">
      {{ section.labelKey | translate }}
    </option>
  </select>
</div>

<router-outlet></router-outlet>
