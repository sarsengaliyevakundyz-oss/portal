<div class="custom-select" *ngIf="!isLoading && allowedSections.length > 0">
  <select (change)="navigateToPage($event)">
    <option
      *ngFor="let section of allowedSections"
      [value]="section.route">
      {{ section.labelKey | translate }}
    </option>
  </select>
</div>

<div *ngIf="isLoading">
  {{ 'common.loading' | translate }}…
</div>

<div *ngIf="!isLoading && allowedSections.length === 0">
  {{ 'У вас нет доступа к административным разделам' | translate }}
</div>

<router-outlet></router-outlet>
