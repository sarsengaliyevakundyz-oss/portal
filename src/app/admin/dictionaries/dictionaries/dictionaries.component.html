<div class="nav-tabs" *ngIf="!isLoading && allowedSections.length > 0">
  <button
    *ngFor="let section of allowedSections"
    class="nav-tab"
    [class.active]="router.url.includes(section.route)"
    (click)="router.navigate([section.route])">
    {{ section.labelKey | translate }}
  </button>
</div>

<div class="loading-text" *ngIf="isLoading">
  {{ 'common.loading' | translate }}…
</div>

<div class="no-access" *ngIf="!isLoading && allowedSections.length === 0">
  {{ 'admin.noAccess' | translate }}
</div>

<router-outlet></router-outlet>
